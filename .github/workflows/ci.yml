name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: levents
          POSTGRES_PASSWORD: levents
          POSTGRES_DB: levents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U levents" --health-interval 5s --health-retries 10
    env:
      POSTGRES_TEST_DSN: postgresql://levents:levents@localhost:5432/levents
      LEVENTS_PII_SALT: ci-salt-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Contract compatibility
        run: levents check-contracts
      - name: Tests (incl. dbt build on DuckDB and the Postgres backend)
        run: pytest --cov-fail-under=80
      - name: Full pipeline on the default synthetic data
        run: levents run-all

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file and build the image
        run: |
          docker compose --profile demo config -q
          docker build -t learning-events-platform:ci .
