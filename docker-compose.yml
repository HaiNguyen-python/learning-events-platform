# Postgres as the warehouse, the ingestion API in front of it, and a one-shot pipeline job.
#   docker compose up -d postgres api
#   docker compose --profile demo run --rm pipeline
# The salt below is for local demos only; set LEVENTS_PII_SALT to a real secret elsewhere.
x-app-env: &app-env
  LEVENTS_WAREHOUSE: postgresql://levents:levents@postgres:5432/levents
  LEVENTS_PII_SALT: ${LEVENTS_PII_SALT:-compose-demo-salt-not-secret}

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: levents
      POSTGRES_PASSWORD: levents
      POSTGRES_DB: levents
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levents"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  pipeline:
    build: .
    profiles: [demo]
    environment: *app-env
    depends_on:
      api: {condition: service_healthy}
    volumes: [./reports:/app/reports]
    command: >
      sh -c "levents generate &&
             levents ingest --url http://api:8000 &&
             levents dbt-build &&
             levents --docs-dir reports/docs --html-dir reports/teacher report"

volumes:
  pgdata:
